<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink - URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 36px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result-box {
            display: none;
            background: #0f172a;
            border: 1px solid #38bdf840;
            border-radius: 10px;
            padding: 18px;
            margin-top: 10px;
            text-align: left;
        }
        .result-link {
            color: #38bdf8;
            font-weight: 600;
            font-size: 17px;
            text-decoration: none;
        }
        .result-link:hover {
            text-decoration: underline;
        }
        .copy-btn {
            background: #334155;
            padding: 6px 12px;
            font-size: 13px;
            float: right;
        }
        .error-box {
            display: none;
            color: #f87171;
            background: #ef444420;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔗 URL Shortener</h1>
        <p>Apna lamba link paste karo aur instant short link pao.</p>

        <form id="shortenForm" class="form-group">
            <input type="text" id="urlInput" placeholder="Paste your long link here..." required />
            <button type="submit" id="btn">Shorten</button>
        </form>

        <div id="errorBox" class="error-box"></div>

        <div id="resultBox" class="result-box">
            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 8px;">Shortened Link:</div>
            <a id="shortLink" class="result-link" href="" target="_blank"></a>
            <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const resultBox = document.getElementById('resultBox');
        const shortLink = document.getElementById('shortLink');
        const errorBox = document.getElementById('errorBox');
        const copyBtn = document.getElementById('copyBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';

            try {
                // Hamare Flask API ko call karna
                const res = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput.value })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Failed');

                shortLink.href = data.short_url;
                shortLink.textContent = data.short_url;
                resultBox.style.display = 'block';
                copyBtn.textContent = 'Copy';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
            }
        });

        function copyLink() {
            navigator.clipboard.writeText(shortLink.href).then(() => {
                copyBtn.textContent = 'Copied!';
                setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
            });
        }
    </script>
</body>
</html>
